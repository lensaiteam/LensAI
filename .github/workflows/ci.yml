name: CI

# Runs the capture-layer invariant suite + the non-advisory guardrail red-team on
# every push/PR (spec invariant 3: "runs in CI from day one"). Pinned to
# Node 24 — better-sqlite3's native addon is ABI-locked to it.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test (invariants + guardrails)
        run: npm test

      - name: Mechanism graph check (schema + guardrail)
        run: npm run graph:check
